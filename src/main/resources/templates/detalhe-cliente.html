<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Ficha do Cliente - Pet Bem-Estar</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <header class="topo">
        <div class="topo-conteudo">
            <img th:src="@{/images/logo.jpg}" alt="Pet Bem-Estar" class="logo">
            <nav class="menu">
                <a th:href="@{/clientes}">Clientes</a>
                <a th:href="@{/animais}">Bichos</a>
                <a th:href="@{/logout}">Sair</a>
            </nav>
        </div>
    </header>

    <main class="conteudo">
        <h1 th:text="${cliente.nome}">Nome do Cliente</h1>

        <p>
            <strong>Telefone:</strong> <span th:text="${cliente.telefone}"></span>
        </p>

        <p class="acoes-topo">
            <a th:href="@{/clientes}" class="botao botao-secundario">Voltar para clientes</a>
        </p>

        <h2>Bichos do cliente</h2>

        <p th:if="${animais.isEmpty()}">Nenhum bicho cadastrado para este cliente.</p>

        <table th:if="${!animais.isEmpty()}">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Raça</th>
                    <th>Espécie</th>
                    <th>Porte</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="animal : ${animais}">
                    <td th:text="${animal.nome}"></td>
                    <td th:text="${animal.raca}"></td>
                    <td th:text="${animal.especie}"></td>
                    <td th:text="${animal.porte}"></td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
