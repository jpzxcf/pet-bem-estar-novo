<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Clientes - Pet Bem-Estar</title>
</head>
<body>
    <h1>Clientes</h1>

    <p>
        <a th:href="@{/clientes/novo}">Novo cliente</a> |
        <a th:href="@{/animais}">Bichos</a> |
        <a th:href="@{/}">Início</a>
    </p>

    <table border="1" cellpadding="6" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Telefone</th>
                <th>E-mail</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="cliente : ${clientes}">
                <td th:text="${cliente.id}"></td>
                <td th:text="${cliente.nome}"></td>
                <td th:text="${cliente.telefone}"></td>
                <td th:text="${cliente.email}"></td>
                <td>
                    <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}">Editar</a>
                    <form th:action="@{/clientes/remover/{id}(id=${cliente.id})}" method="post" style="display:inline;">
                        <input type="hidden" name="id" th:value="${cliente.id}">
                        <button type="submit">Remover</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
