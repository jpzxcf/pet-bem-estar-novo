<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Clientes - Pet Bem-Estar</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <header class="topo">
        <div class="topo-conteudo">
            <img th:src="@{/images/logo.jpg}" alt="Pet Bem-Estar" class="logo">
            <nav class="menu">
                <a th:href="@{/clientes}">Clientes</a>
                <a th:href="@{/animais}">Bichos</a>
                <a th:href="@{/logout}">Sair</a>
            </nav>
        </div>
    </header>

    <main class="conteudo">
        <h1>Clientes</h1>

        <p class="acoes-topo">
            <a th:href="@{/clientes/novo}" class="botao">Novo cliente</a>
        </p>

        <p class="erro" th:if="${erro}" th:text="${erro}"></p>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>E-mail</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cliente : ${clientes}">
                    <td th:text="${cliente.id}"></td>
                    <td>
                        <a th:href="@{/clientes/{id}(id=${cliente.id})}" th:text="${cliente.nome}"></a>
                    </td>
                    <td th:text="${cliente.telefone}"></td>
                    <td th:text="${cliente.email}"></td>
                    <td>
                        <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="botao">Editar</a>
                        <form th:action="@{/clientes/remover/{id}(id=${cliente.id})}" method="post" style="display:inline;">
                            <input type="hidden" name="id" th:value="${cliente.id}">
                            <button type="submit" class="botao-secundario">Remover</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
