<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Cliente - Pet Bem-Estar</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <header class="topo">
        <div class="topo-conteudo">
            <img th:src="@{/images/logo.jpg}" alt="Pet Bem-Estar" class="logo">
            <nav class="menu">
                <a th:href="@{/clientes}">Clientes</a>
                <a th:href="@{/animais}">Bichos</a>
                <a th:href="@{/logout}">Sair</a>
            </nav>
        </div>
    </header>

    <main class="conteudo">
        <h1 th:text="${cliente.id == null ? 'Novo Cliente' : 'Editar Cliente'}">Cliente</h1>

        <p class="erro" th:if="${erro}" th:text="${erro}"></p>

        <form th:action="@{/clientes/salvar}" th:object="${cliente}" method="post">
            <input type="hidden" th:field="*{id}">

            <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" th:field="*{nome}">
                <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
            </div>

            <div>
                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" th:field="*{telefone}">
                <span th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></span>
            </div>

            <div>
                <label for="email">E-mail:</label>
                <input type="email" id="email" th:field="*{email}">
            </div>

            <div>
                <button type="submit">Salvar</button>
                <a th:href="@{/clientes}" class="botao botao-secundario">Voltar</a>
            </div>
        </form>
    </main>
</body>
</html>
