<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Cliente - Pet Bem-Estar</title>
</head>
<body>
    <h1 th:text="${cliente.id == null ? 'Novo Cliente' : 'Editar Cliente'}">Cliente</h1>

    <form th:action="@{/clientes/salvar}" th:object="${cliente}" method="post">
        <input type="hidden" th:field="*{id}">

        <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" th:field="*{nome}">
            <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" style="color: red;"></span>
        </div>

        <div>
            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" th:field="*{telefone}">
            <span th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}" style="color: red;"></span>
        </div>

        <div>
            <label for="email">E-mail:</label>
            <input type="email" id="email" th:field="*{email}">
        </div>

        <div>
            <button type="submit">Salvar</button>
            <a th:href="@{/clientes}">Voltar</a>
        </div>
    </form>
</body>
</html>
