<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pet Bem-Estar</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <header class="topo">
        <div class="topo-conteudo">
            <img th:src="@{/images/logo.jpg}" alt="Pet Bem-Estar" class="logo">
            <nav class="menu">
                <a th:href="@{/clientes}">Clientes</a>
                <a th:href="@{/animais}">Bichos</a>
                <a th:href="@{/logout}">Sair</a>
            </nav>
        </div>
    </header>

    <main class="conteudo boas-vindas">
        <h1>Bem-vindo, <span th:text="${session.usuarioLogado != null ? session.usuarioLogado.nomeUsuario : ''}"></span>!</h1>
    </main>
</body>
</html>
