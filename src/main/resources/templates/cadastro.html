<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuário - Pet Bem-Estar</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body class="pagina-login">
    <div class="login-box">
        <img th:src="@{/images/logo.jpg}" alt="Pet Bem-Estar" class="logo">

        <h1>Cadastro de Usuário</h1>

        <p class="erro" th:if="${erro}" th:text="${erro}"></p>

        <form th:action="@{/cadastro}" th:object="${usuario}" method="post">
            <div>
                <label for="nomeUsuario">Nome de usuário:</label>
                <input type="text" id="nomeUsuario" th:field="*{nomeUsuario}">
                <span th:if="${#fields.hasErrors('nomeUsuario')}" th:errors="*{nomeUsuario}"></span>
            </div>
            <div>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" th:field="*{senha}">
                <span th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></span>
            </div>
            <div>
                <button type="submit">Cadastrar</button>
            </div>
        </form>

        <p>Já tem conta? <a th:href="@{/login}">Voltar para login</a></p>
    </div>
</body>
</html>
